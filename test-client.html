<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.io Test Client</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
  <h1>Hangman Game Test</h1>
  <button onclick="setWord()">Set Word</button>
  <button onclick="makeGuess()">Make Guess</button>
  <button onclick="resetGame()">Reset Game</button>

  <script>
    const socket = io('http://localhost:4000'); // Make sure this matches your server's URL

    socket.on('connect', () => {
      console.log('Connected to the server:', socket.id);
    });

    socket.on('gameStart', (data) => {
      console.log('Game started:', data);
    });

    socket.on('updateWord', (data) => {
      console.log('Word updated:', data);
    });

    socket.on('resetGame', () => {
      console.log('Game has been reset.');
    });

    function setWord() {
      socket.emit('setWord', { userWord: 'example', wordWithUnderscore: Array(7).fill('_') });
    }

    function makeGuess() {
      socket.emit('makeGuess', {
        updatedWord: ['e', '_', '_', 'm', '_', '_', 'e'],
        wrongGuessCount: 1,
        bodyParts: ['\n +---+\n |   |\n O   |\n     |\n     |\n     |\n=========']
      });
    }

    function resetGame() {
      socket.emit('resetGame');
    }
  </script>
</body>
</html>
